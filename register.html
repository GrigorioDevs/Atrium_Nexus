<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atrium Nexus - Cadastro</title>

<!-- Icon title (melhor absoluto) -->
<link rel="icon" href="/assets/img/logo_atrium.png" type="image/x-icon">

<!-- Fonte Roboto (mesma do home) -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',sans-serif}
:root{
  --c1:#00E0FF; --c2:#FF2FB9;
  --bg:#0B1622; --panel:#0F1E2C;
  --text:#E7EEF6; --muted:#9fb1c3;
  --border:rgba(255,255,255,.12);
}

html,body{
  height:100%;width:100%;
  background:radial-gradient(1200px 800px at 10% 10%,rgba(0,224,255,.08),transparent 60%),
             radial-gradient(1200px 800px at 90% 90%,rgba(255,47,185,.08),transparent 60%),
             var(--bg);
  display:flex;justify-content:center;align-items:center;color:var(--text)
}

/* Container centralizado */
.container{width:100%;max-width:520px;padding:16px}

/* Card */
.card-cadastro{
  background:var(--panel);
  border-radius:16px;
  padding:26px 20px;
  width:100%;
  box-shadow:0 18px 40px rgba(0,0,0,.35);
  border:1px solid var(--border);
}
.card-cadastro h2{
  text-align:center;margin-bottom:18px;
  font-weight:800;letter-spacing:.2px;color:var(--text)
}

/* Labels e inputs */
.card-cadastro label{
  display:block;font-size:14px;margin:12px 0 6px;color:var(--text);font-weight:600
}
.card-cadastro input{
  width:100%;padding:12px;border-radius:10px;
  background:#0a1520;color:var(--text);
  border:1px solid rgba(0,224,255,.20);font-size:15px;outline:none;transition:.2s
}
.card-cadastro input::placeholder{color:#7d93a7}
.card-cadastro input:focus{border-color:rgba(0,224,255,.45); box-shadow:0 0 0 3px rgba(0,224,255,.10)}

/* Linha de senha com botão olho */
.pwd-wrap{position:relative}
.pwd-toggle{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  cursor:pointer;
  background:linear-gradient(90deg,var(--c1),var(--c2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-size:16px;user-select:none;
}

/* Botão */
.card-cadastro button{
  width:100%;padding:14px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  color:#00121E;font-size:16px;font-weight:800;cursor:pointer;transition:.25s;margin-top:14px;
  border:1px solid rgba(255,255,255,.25)
}
.card-cadastro button:hover{filter:brightness(1.08); box-shadow:0 14px 30px rgba(0,0,0,.25)}
.card-cadastro button:active{transform:scale(.99)}

/* Helpers */
.helper{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}
.helper.ok{color:#10b981}
.helper.bad{color:#f87171}

/* Link voltar */
.back{
  display:flex;gap:10px;align-items:center;justify-content:center;
  margin-top:10px;
  background:#0a1520;color:#eaf6ff;padding:12px 20px;border-radius:12px;
  font-size:14px;font-weight:700;cursor:pointer;
  border:1px dashed rgba(255,255,255,.3);
  transition:background .15s ease,border-color .15s ease;
  user-select:none;
}
.back:hover{
  background:linear-gradient(135deg,rgba(0,224,255,.18),rgba(255,47,185,.18));
  border-color:rgba(255,255,255,.5);
}

/* Responsivo */
@media(max-width:768px){
  .card-cadastro{padding:22px 18px}
  .card-cadastro h2{font-size:22px}
}
@media(max-width:480px){
  .card-cadastro{padding:18px 14px}
  .card-cadastro h2{font-size:20px}
  .card-cadastro label,.card-cadastro input,.card-cadastro button{font-size:14px}
  body,html{padding:0 10px}
}
</style>
</head>

<body>
<div class="container">
  <div class="card-cadastro">
    <h2>Cadastro de Usuário</h2>

    <form id="formCadastro" novalidate>
      <label for="login">Nome Login</label>
      <input type="text" id="login" required placeholder="Seu nome de usuário" autocomplete="username">

      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="voce@empresa.com" autocomplete="email">

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" maxlength="14" required placeholder="000.000.000-00" inputmode="numeric" autocomplete="off">
      <div class="helper" id="cpfHelper"></div>

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" required placeholder="(11) 90000-0000" inputmode="numeric" autocomplete="tel">
      <div class="helper" id="telHelper"></div>

      <label for="senha">Senha</label>
      <div class="pwd-wrap">
        <input type="password" id="senha" required placeholder="Crie uma senha" autocomplete="new-password">
        <span class="pwd-toggle" id="togglePwd1" title="Mostrar/ocultar">
          <i class="fa-regular fa-eye"></i>
        </span>
      </div>

      <label for="senhaConfirma">Confirmar Senha</label>
      <div class="pwd-wrap">
        <input type="password" id="senhaConfirma" required placeholder="Repita a senha" autocomplete="new-password">
        <span class="pwd-toggle" id="togglePwd2" title="Mostrar/ocultar">
          <i class="fa-regular fa-eye"></i>
        </span>
      </div>

      <button type="submit" id="btnCadastrar">Cadastrar</button>

      <div class="back" onclick="voltarLogin()">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Voltar para o login</span>
      </div>
    </form>
  </div>
</div>

<script>
/* =========================
   CONFIG API (VPS/NGINX)
   =========================
   Se o Nginx faz proxy da API em /api no MESMO domínio do front,
   deixe API_BASE = "" (padrão abaixo).
   Se sua API estiver em outro host, você pode definir:
   window.API_BASE = "https://hml.atrium.tech";
*/
const API_BASE = String(window.API_BASE || "").replace(/\/+$/, "");

/* Helpers */
function onlyDigits(v){ return String(v || "").replace(/\D/g, ""); }
function setHelper(el, text, cls){
  el.textContent = text || "";
  el.classList.remove("ok","bad");
  if(cls) el.classList.add(cls);
}

/* CPF máscara */
function maskCpf(v){
  const d = onlyDigits(v).slice(0,11);
  const p1 = d.slice(0,3), p2 = d.slice(3,6), p3 = d.slice(6,9), p4 = d.slice(9,11);
  let out = p1;
  if(p2) out += "." + p2;
  if(p3) out += "." + p3;
  if(p4) out += "-" + p4;
  return out;
}

/* Telefone máscara (11) 90000-0000 ou (11) 0000-0000 */
function maskPhone(v){
  const d = onlyDigits(v).slice(0,11);
  const ddd = d.slice(0,2);
  const rest = d.slice(2);

  if(!ddd) return "";
  if(rest.length <= 4) return `(${ddd}) ${rest}`;
  if(rest.length <= 8) return `(${ddd}) ${rest.slice(0,4)}-${rest.slice(4)}`;
  // 9 dígitos
  return `(${ddd}) ${rest.slice(0,5)}-${rest.slice(5,9)}`;
}

/* Toggle password */
function bindToggle(btnId, inputId){
  const btn = document.getElementById(btnId);
  const input = document.getElementById(inputId);
  btn.addEventListener("click", ()=>{
    input.type = input.type === "password" ? "text" : "password";
    const ic = btn.querySelector("i");
    ic.classList.toggle("fa-eye");
    ic.classList.toggle("fa-eye-slash");
  });
}
bindToggle("togglePwd1","senha");
bindToggle("togglePwd2","senhaConfirma");

function voltarLogin(){ window.location.href = "index.html"; }

/* Inputs com máscara + feedback */
const cpfInput = document.getElementById("cpf");
const cpfHelper = document.getElementById("cpfHelper");
cpfInput.addEventListener("input", ()=>{
  cpfInput.value = maskCpf(cpfInput.value);
  const digits = onlyDigits(cpfInput.value);
  if(digits.length === 11) setHelper(cpfHelper, "CPF preenchido.", "ok");
  else setHelper(cpfHelper, "");
});

const telInput = document.getElementById("telefone");
const telHelper = document.getElementById("telHelper");
telInput.addEventListener("input", ()=>{
  telInput.value = maskPhone(telInput.value);
  const digits = onlyDigits(telInput.value);
  if(digits.length === 10 || digits.length === 11) setHelper(telHelper, "Telefone preenchido.", "ok");
  else setHelper(telHelper, "");
});

/* Cadastro via API */
document.getElementById('formCadastro').addEventListener('submit', async function(e){
  e.preventDefault();

  const btn = document.getElementById("btnCadastrar");
  btn.disabled = true;
  btn.textContent = "Cadastrando...";

  const loginField  = document.getElementById('login').value.trim();
  const email       = document.getElementById('email').value.trim();
  const cpfRaw      = document.getElementById('cpf').value;
  const telefoneRaw = document.getElementById('telefone').value;
  const senha       = document.getElementById('senha').value;
  const senhaConf   = document.getElementById('senhaConfirma').value;

  const nome  = loginField;
  const login = loginField;

  const cpf      = onlyDigits(cpfRaw);
  const telefone = onlyDigits(telefoneRaw);

  try {
    if (!nome || !login || !email || !cpf || !telefone || !senha || !senhaConf) {
      alert("Preencha todos os campos.");
      return;
    }
    if (cpf.length !== 11) {
      alert("CPF inválido (precisa ter 11 dígitos).");
      return;
    }
    if (!(telefone.length === 10 || telefone.length === 11)) {
      alert("Telefone inválido (precisa ter DDD + número).");
      return;
    }
    if (senha.length < 4) {
      alert("Senha muito curta.");
      return;
    }
    if (senha !== senhaConf) {
      alert("As senhas não coincidem!");
      return;
    }

    // 1 Admin, 2 Gestão, 3 ST, 4 Funcionário
    const typeUser = 4;

    const body = {
      nome,
      login,
      email,
      cpf,
      telefone,
      senha,
      confirmarSenha: senhaConf,
      typeUser
    };

    // ⚠️ ajuste o endpoint se o seu back for diferente
    const response = await fetch(`${API_BASE}/api/usuarios`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      credentials: "include"
    });

    if (response.ok) {
      let resultado = null;
      try { resultado = await response.json(); } catch {}
      alert(resultado?.message || "Usuário cadastrado com sucesso!");
      this.reset();
      setHelper(cpfHelper, "");
      setHelper(telHelper, "");
      window.location.href = "index.html";
      return;
    }

    // tenta pegar mensagem do backend (json ou texto)
    let msg = "";
    try {
      const asJson = await response.json();
      msg = asJson?.message || JSON.stringify(asJson);
    } catch {
      msg = await response.text().catch(()=> "");
    }

    if (response.status === 400) {
      alert(msg || "Dados inválidos. Verifique as informações e tente novamente.");
      return;
    }
    if (response.status === 409) {
      alert(msg || "Já existe um usuário com esse login/CPF.");
      return;
    }

    alert(msg || `Erro no servidor ao cadastrar usuário (Status ${response.status}).`);

  } catch (error) {
    alert("Erro ao conectar com o servidor: " + (error?.message || error));
  } finally {
    btn.disabled = false;
    btn.textContent = "Cadastrar";
  }
});
</script>

</body>
</html>
